name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: []
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and push client image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:latest \
            -f apps/client/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:latest

      - name: Build and push server image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:latest \
            -f apps/server/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:latest

      - name: Deploy client to Cloud Run
        run: |
          gcloud run deploy momotombo-client \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }}" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      - name: Deploy server to Cloud Run
        run: |
          gcloud run deploy momotombo-server \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --set-env-vars "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set-env-vars "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set-env-vars "SENTRY_DSN=${{ secrets.SENTRY_DSN_SERVER }}" \
            --set-env-vars "NODE_ENV=production" \
            --memory 1Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 20 \
            --timeout 60

      - name: Run database migrations
        run: |
          gcloud run jobs execute momotombo-migrate \
            --region us-central1 \
            --wait || true

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Client URL: https://momotombo-client-xxx.run.app"
          echo "Server URL: https://momotombo-server-xxx.run.app"
