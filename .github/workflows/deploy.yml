name: Deploy

# Deploys only after CI succeeds on main (or manual dispatch)
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      # NEXT_PUBLIC_* are build-time inlined by Next.js; runtime env vars have no effect
      - name: Build and push client image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:latest \
            -f apps/client/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:latest

      - name: Build and push server image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:latest \
            -f apps/server/Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:latest

      - name: Deploy client to Cloud Run
        run: |
          gcloud run deploy momotombo-client \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-client:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10

      # Secrets live in Google Secret Manager (never in revision metadata).
      # Required secret names: DATABASE_URL, JWT_SECRET, STRIPE_SECRET_KEY,
      # STRIPE_WEBHOOK_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GEMINI_API_KEY,
      # PINECONE_API_KEY, SENTRY_DSN_SERVER
      - name: Deploy server to Cloud Run
        run: |
          gcloud run deploy momotombo-server \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --set-secrets "JWT_SECRET=JWT_SECRET:latest" \
            --set-secrets "STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest" \
            --set-secrets "STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest" \
            --set-secrets "GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest" \
            --set-secrets "GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --set-secrets "PINECONE_API_KEY=PINECONE_API_KEY:latest" \
            --set-secrets "SENTRY_DSN=SENTRY_DSN_SERVER:latest" \
            --memory 1Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 20 \
            --timeout 60

      # Idempotent: create the migrate job once, then point it at the fresh image.
      # The job runs `prisma migrate deploy` from the server image (prisma CLI ships in deps).
      - name: Create or update database migrate job
        run: |
          if gcloud run jobs describe momotombo-migrate --region us-central1 >/dev/null 2>&1; then
            ACTION=update
          else
            ACTION=create
          fi
          gcloud run jobs $ACTION momotombo-migrate \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/momotombo-server:${{ github.sha }} \
            --region us-central1 \
            --command "npx" \
            --args "prisma,migrate,deploy" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --max-retries 0 \
            --task-timeout 300

      # No `|| true`: a failed migration must fail the deploy
      - name: Run database migrations
        run: gcloud run jobs execute momotombo-migrate --region us-central1 --wait

      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Client URL: https://momotombo-client-xxx.run.app"
          echo "Server URL: https://momotombo-server-xxx.run.app"
