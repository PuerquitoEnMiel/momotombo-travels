name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Lint & Type check
  # ───────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Client lint
        run: npm run lint --workspace=apps/client
      - name: Server lint
        run: npm run lint --workspace=apps/server
      - name: Server type check
        run: npx tsc --noEmit --project apps/server/tsconfig.json

  # ───────────────────────────────────────────────
  # Client unit tests (Vitest)
  # ───────────────────────────────────────────────
  test-client:
    name: Client Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run client tests
        run: npm run test --workspace=apps/client
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: apps/client/coverage/

  # ───────────────────────────────────────────────
  # Server unit tests (Jest)
  # ───────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: momotombo
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: momotombo_travels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://momotombo:password123@localhost:5432/momotombo_travels_test
      JWT_SECRET: ci-test-jwt-secret-must-be-32-chars-minimum-length-here
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/server
      - name: Run server tests
        run: npm run test --workspace=apps/server
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/coverage/

  # ───────────────────────────────────────────────
  # Build both apps
  # ───────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-client, test-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build client
        run: npm run build --workspace=apps/client
      - name: Build server
        run: npm run build --workspace=apps/server
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: apps/client/.next/
          retention-days: 7
      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: apps/server/dist/
          retention-days: 7

  # ───────────────────────────────────────────────
  # E2E tests (Playwright)
  # ───────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: momotombo
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: momotombo_travels_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://momotombo:password123@localhost:5432/momotombo_travels_e2e
      JWT_SECRET: ci-e2e-jwt-secret-must-be-32-chars-minimum-length-here
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/server
      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: apps/server
      - name: Build apps
        run: |
          npm run build --workspace=apps/server
          npm run build --workspace=apps/client
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
